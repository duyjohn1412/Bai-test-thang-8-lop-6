<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài test tháng 8 lớp 6</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #4A90E2; /* Xanh dương dễ thương cho lớp 6 */
            --secondary: #FF6B6B; /* Đỏ san hô */
            --accent: #FDCB6E; /* Vàng sáng */
            --correct: #00D26A;
            --correct-shadow: #00a051;
            --wrong: #FF4757;
            --wrong-shadow: #d1303e;
            --btn-normal: #ffffff;
            --btn-normal-shadow: #e0e0e0;
            --text-main: #2d3436;
            --bg-card: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #4A90E2, #FDCB6E, #FF6B6B, #A8E6CF);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Họa tiết nổi vui nhộn (ngôi sao, đám mây, mặt cười) */
        .pattern-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20,20 Q30,10 40,20 T60,20' stroke='rgba(255,255,255,0.4)' fill='none' stroke-width='3'/%3E%3Cpolygon points='80,20 85,35 100,35 88,45 92,60 80,50 68,60 72,45 60,35 75,35' fill='rgba(255,255,255,0.3)'/%3E%3Ccircle cx='30' cy='90' r='10' fill='rgba(255,255,255,0.2)'/%3E%3Cpath d='M90,90 a10,10 0 0,0 20,0' stroke='rgba(255,255,255,0.4)' fill='none' stroke-width='3'/%3E%3C/svg%3E");
            background-size: 150px;
            animation: floatUp 35s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatUp {
            from { background-position: 0 100vh; }
            to { background-position: 100vw 0; }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header-title {
            text-align: center;
            color: white;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 900;
        }

        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            margin-bottom: 25px;
            transition: transform 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .question-text {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.5;
            color: #2c3e50;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-option {
            background-color: var(--btn-normal);
            color: var(--text-main);
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px 20px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--btn-normal-shadow);
            transition: all 0.1s;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .btn-option:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 var(--btn-normal-shadow);
            border-color: var(--primary);
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 0 0 transparent;
        }

        .btn-option.correct {
            background-color: var(--correct) !important;
            color: white !important;
            border-color: var(--correct);
            box-shadow: 0 6px 0 var(--correct-shadow) !important;
        }

        .btn-option.wrong {
            background-color: var(--wrong) !important;
            color: white !important;
            border-color: var(--wrong);
            box-shadow: 0 6px 0 var(--wrong-shadow) !important;
        }

        .btn-option:disabled { cursor: not-allowed; opacity: 0.9; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.5s; }

        /* Khung giải thích siêu chi tiết */
        .explanation {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background-color: #f8f9fa;
            border-left: 6px solid var(--primary);
            border-radius: 12px;
            font-size: 16px;
            line-height: 1.6;
            animation: slideDown 0.3s ease;
        }
        
        .explanation h4 { color: var(--secondary); margin-bottom: 12px; font-size: 19px; font-weight: 800;}
        .explanation p { margin-bottom: 8px; }
        .explanation b { color: #d35400; }
        .explanation .trans { font-style: italic; color: #16a085; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Split View Reading */
        .reading-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .reading-text {
            flex: 1;
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            border: 3px dashed var(--primary);
            line-height: 2;
            font-size: 17px;
        }
        .reading-questions { flex: 1; }
        .gap-select {
            appearance: none;
            background-color: #f1f2f6;
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 4px 12px;
            font-weight: bold;
            color: var(--primary);
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(74, 144, 226, 0.3);
            margin: 0 5px;
            font-size: 16px;
        }
        .gap-select.correct { background: var(--correct); color: white; border-color: var(--correct); box-shadow: none; transform: translateY(4px);}
        .gap-select.wrong { background: var(--wrong); color: white; border-color: var(--wrong); box-shadow: none; transform: translateY(4px); }

        /* Rewriting Input */
        .rewrite-input {
            width: 100%;
            padding: 15px;
            font-size: 17px;
            border: 2px solid #ccc;
            border-radius: 12px;
            margin-bottom: 10px;
            outline: none;
            font-weight: 600;
            color: #2c3e50;
        }
        .rewrite-input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(74,144,226,0.3); }
        .rewrite-input.correct { border-color: var(--correct); background: #e8f8f5;}
        .rewrite-input.wrong { border-color: var(--wrong); background: #fdedec;}
        
        .btn-check {
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 0 #c0392b;
        }
        .btn-check:active { transform: translateY(6px); box-shadow: none; }

        #login-screen, #result-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-content input {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            border-radius: 12px;
            border: 2px solid var(--primary);
            font-size: 18px;
            text-align: center;
            font-weight: bold;
        }
        .btn-start {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 15px;
            box-shadow: 0 6px 0 #2980b9;
            cursor: pointer;
            font-weight: 900;
            width: 100%;
        }
        
        .section-title {
            background: var(--secondary);
            color: white;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: 900;
            font-size: 20px;
            box-shadow: 0 4px 0 #c0392b;
        }

        #submit-test {
            display: block;
            margin: 30px auto 50px;
            background: var(--accent);
            color: #d35400;
            border: none;
            padding: 20px 50px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 20px;
            box-shadow: 0 8px 0 #e1b12c;
            cursor: pointer;
            transition: 0.2s;
        }
        #submit-test:hover { transform: translateY(-2px); box-shadow: 0 10px 0 #e1b12c; }
        #submit-test:active { transform: translateY(8px); box-shadow: none; }

        @media (max-width: 768px) {
            .options-grid { grid-template-columns: 1fr; }
            .reading-container { flex-direction: column; }
            .reading-text, .reading-questions { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="pattern-bg"></div>

    <!-- Màn hình Đăng nhập -->
    <div id="login-screen">
        <div class="modal-content">
            <h1 style="color: var(--primary); margin-bottom: 10px; font-size: 32px;">🌟 BÀI TEST LỚP 6 🌟</h1>
            <p style="font-weight: bold; color: #7f8c8d;">Hãy nhập tên để bắt đầu thử thách nhé!</p>
            <input type="text" id="studentName" placeholder="Tên của con là gì?..." required>
            <button class="btn-start" onclick="startTest()">BẮT ĐẦU CHIẾN ĐẤU! 🚀</button>
        </div>
    </div>

    <!-- Màn hình Kết quả -->
    <div id="result-screen" style="display: none;">
        <div class="modal-content">
            <h1 style="color: var(--correct); font-size: 35px;">🎉 CHÚC MỪNG 🎉</h1>
            <h2 id="result-name" style="margin: 15px 0; color: var(--primary);"></h2>
            <p style="font-size: 20px; font-weight: bold;">Điểm của con là:</p>
            <h1 id="result-score" style="font-size: 55px; color: var(--secondary); margin: 10px 0; text-shadow: 2px 2px 0px #eee;"></h1>
            <p id="result-feedback" style="font-weight: 800; margin-bottom: 20px; color: #2c3e50; font-size: 18px;"></p>
            <p style="font-size: 14px; color: #95a5a6; font-style: italic;">(Kết quả đã được gửi cho cô giáo)</p>
        </div>
    </div>

    <!-- Form Test chính -->
    <div class="container" id="quiz-container" style="display: none;">
        <h2 class="header-title">📝 BÀI KIỂM TRA TIẾNG ANH LỚP 6</h2>
        <div id="questions-area"></div>
        <button id="submit-test" onclick="submitTest()">NỘP BÀI & XEM ĐIỂM 🏆</button>
    </div>

    <!-- Google Form Ẩn -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { showResultScreen(); }"></iframe>
    <form id="ss-form" action="https://docs.google.com/forms/d/e/1FAIpQLSelQyzh_lWyb2vZUnQ1jc1p9FLRknDZiUt9NiUiiX1epHTFLw/formResponse" method="POST" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="entry.351633352" value="Bài test Tiếng Anh Lớp 6" id="form-testname">
        <input type="hidden" name="entry.1895948982" value="" id="form-tenhs">
        <input type="hidden" name="entry.1232319784" value="" id="form-diem">
        <input type="hidden" name="entry.1125920425" value="" id="form-tile">
        <input type="hidden" name="entry.1907417670" value="" id="form-loisai">
    </form>

    <script>
        // --- HỆ THỐNG ÂM THANH WEB AUDIO API ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playDing() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Nốt A5
            osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // Lên A6
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function playBuzz() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // --- CƠ SỞ DỮ LIỆU CÂU HỎI VÀ GIẢI THÍCH SIÊU CHI TIẾT ---
        const questionsData = [
            // PHONETICS
            {
                id: 1, section: "I. PHONETICS", instruction: "Mark the letter A, B, C, or D to indicate the word whose underlined part differs from the other three in pronunciation.",
                qText: "1. A. br<u>o</u>ther    B. m<u>o</u>ther    C. p<u>u</u>t    D. s<u>o</u>me",
                options: ["br<u>o</u>ther", "m<u>o</u>ther", "p<u>u</u>t", "s<u>o</u>me"], correct: 2,
                exp: `<h4>Giải thích chi tiết:</h4>
                <p><b>1. Phân tích phát âm:</b></p>
                <p>A. br<u>o</u>ther /ˈbrʌðə(r)/<br>B. m<u>o</u>ther /ˈmʌðə(r)/<br>C. p<u>u</u>t /pʊt/<br>D. s<u>o</u>me /sʌm/</p>
                <p><b>2. Tại sao chọn C?</b><br>Phần gạch chân ở đáp án C được phát âm là <b>/ʊ/</b> (u ngắn). Trong khi đó, các đáp án A, B, D đều được phát âm là <b>/ʌ/</b> (âm á).</p>`
            },
            {
                id: 2, qText: "2. A. p<u>a</u>rk    B. st<u>a</u>rt    C. c<u>a</u>t    D. sm<u>a</u>rt",
                options: ["p<u>a</u>rk", "st<u>a</u>rt", "c<u>a</u>t", "sm<u>a</u>rt"], correct: 2,
                exp: `<h4>Giải thích chi tiết:</h4>
                <p><b>1. Phân tích phát âm:</b></p>
                <p>A. p<u>a</u>rk /pɑːk/<br>B. st<u>a</u>rt /stɑːt/<br>C. c<u>a</u>t /kæt/<br>D. sm<u>a</u>rt /smɑːt/</p>
                <p><b>2. Tại sao chọn C?</b><br>Từ "cat" có phần gạch chân phát âm là <b>/æ/</b> (âm a bẹt). Các đáp án A, B, D khi chữ 'a' đi liền với chữ 'r' (ar) thường phát âm là <b>/ɑː/</b> (âm a dài).</p>`
            },
            {
                id: 3, qText: "3. A. desk<u>s</u>    B. map<u>s</u>    C. plant<u>s</u>    D. room<u>s</u>",
                options: ["desk<u>s</u>", "map<u>s</u>", "plant<u>s</u>", "room<u>s</u>"], correct: 3,
                exp: `<h4>Giải thích chi tiết:</h4>
                <p><b>1. Nhắc lại quy tắc phát âm đuôi "s/es":</b><br>
                - Phát âm là <b>/s/</b> khi từ kết thúc bằng các âm vô thanh: /p/, /k/, /t/, /f/, /θ/ (thần tài phố cổ).<br>
                - Phát âm là <b>/z/</b> khi kết thúc bằng nguyên âm hoặc âm hữu thanh.</p>
                <p><b>2. Phân tích:</b><br>A. desk<u>s</u> /desks/ (kết thúc bằng âm /k/)<br>B. map<u>s</u> /mæps/ (kết thúc bằng âm /p/)<br>C. plant<u>s</u> /plɑːnts/ (kết thúc bằng âm /t/)<br>D. room<u>s</u> /ruːmz/ (kết thúc bằng âm /m/ - hữu thanh).</p>
                <p><b>3. Kết luận:</b> Chọn D vì phát âm là /z/, còn lại là /s/.</p>`
            },
            {
                id: 4, qText: "4. A. pen<u>s</u>    B. book<u>s</u>    C. teacher<u>s</u>    D. ruler<u>s</u>",
                options: ["pen<u>s</u>", "book<u>s</u>", "teacher<u>s</u>", "ruler<u>s</u>"], correct: 1,
                exp: `<h4>Giải thích chi tiết:</h4>
                <p><b>1. Phân tích:</b><br>A. pen<u>s</u> /penz/ (âm cuối là /n/ hữu thanh -> phát âm /z/)<br>B. book<u>s</u> /bʊks/ (âm cuối là /k/ vô thanh -> phát âm /s/)<br>C. teacher<u>s</u> /ˈtiːtʃəz/ (âm cuối nguyên âm -> phát âm /z/)<br>D. ruler<u>s</u> /ˈruːləz/ (âm cuối nguyên âm -> phát âm /z/)</p>
                <p><b>2. Tại sao chọn B?</b><br>Đuôi 's' trong từ "books" phát âm là <b>/s/</b>, khác với các từ còn lại phát âm là <b>/z/</b>.</p>`
            },
            {
                id: 5, qText: "5. A. h<u>ou</u>se    B. l<u>u</u>nch    C. s<u>u</u>n    D. f<u>u</u>n",
                options: ["h<u>ou</u>se", "l<u>u</u>nch", "s<u>u</u>n", "f<u>u</u>n"], correct: 0,
                exp: `<h4>Giải thích chi tiết:</h4>
                <p><b>1. Phân tích phát âm:</b></p>
                <p>A. h<u>ou</u>se /haʊs/<br>B. l<u>u</u>nch /lʌntʃ/<br>C. s<u>u</u>n /sʌn/<br>D. f<u>u</u>n /fʌn/</p>
                <p><b>2. Tại sao chọn A?</b><br>Chữ "ou" trong house phát âm là nguyên âm đôi <b>/aʊ/</b>. Các từ còn lại chứa chữ "u" phát âm là <b>/ʌ/</b> (âm á).</p>`
            },

            // MULTIPLE CHOICE
            {
                id: 6, section: "II. MULTIPLE CHOICE", instruction: "Mark the letter A, B, C, or D to indicate the correct answer to each of the following questions.",
                qText: "6. Most schools require children to wear school ____.",
                options: ["equipment", "favourite", "uniforms", "creative"], correct: 2,
                exp: `<h4>Giải thích chi tiết:</h4>
                <p><b>1. Dịch câu hỏi:</b> Hầu hết các trường học yêu cầu học sinh mặc đồng phục trường.</p>
                <p><b>2. Phân tích đáp án:</b><br>A. equipment (n): thiết bị.<br>B. favourite (adj/n): yêu thích.<br>C. uniforms (n): đồng phục.<br>D. creative (adj): sáng tạo.</p>
                <p><b>3. Tại sao chọn C?</b><br>Động từ <b>"wear"</b> (mặc) bắt buộc tân ngữ theo sau phải là trang phục. Cụm từ <b>"school uniforms"</b> (đồng phục học sinh) là đáp án hoàn toàn chính xác về mặt ngữ nghĩa và sự kết hợp từ (collocation).</p>`
            },
            {
                id: 7, qText: "7. We play ____ at break time.",
                options: ["exercise", "History", "judo", "football"], correct: 3,
                exp: `<h4>Giải thích chi tiết:</h4>
                <p><b>1. Dịch câu hỏi:</b> Chúng tôi chơi bóng đá vào giờ ra chơi.</p>
                <p><b>2. Phân tích sự kết hợp từ (Collocations):</b><br>A. exercise (tập thể dục): đi với động từ "do" (do exercise).<br>B. History (Lịch sử): đi với động từ "study / learn".<br>C. judo (võ judo): đi với động từ "do" (do judo).<br>D. football (bóng đá): môn thể thao dùng bóng, đi với động từ "play" (play football).</p>
                <p><b>3. Kết luận:</b> Chọn D vì phù hợp với động từ "play" đứng trước khoảng trống.</p>`
            },
            {
                id: 8, qText: "8. It’s a difficult calculation. Can I borrow your ____?",
                options: ["ruler", "schoolbag", "pencil case", "calculator"], correct: 3,
                exp: `<h4>Giải thích chi tiết:</h4>

        // Thuật toán xáo trộn mảng MCQ (Fisher-Yates)
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            let indices = Array.from(Array(array.length).keys());
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                [indices[currentIndex], indices[randomIndex]] = [indices[randomIndex], indices[currentIndex]];
            }
            return { shuffledArray: array, newIndicesMap: indices };
        }

                    currentSection = q.section;
                }

                const shuffleResult = shuffleArray([...q.options]);
                const newOptions = shuffleResult.shuffledArray;
                const correctIndexNow = shuffleResult.newIndicesMap.indexOf(q.correct);

                let btnHtml = "";
                const labels = ["A", "B", "C", "D"];

                html += `

        // 1. Chấm Trắc nghiệm
        function checkMCQ(qId, btnIdx, isCorrect, chosenLabel) {
            const grid = document.getElementById(`grid-${qId}`);
            const buttons = grid.querySelectorAll('.btn-option');
            const card = document.getElementById(`card-${qId}`);
            const exp = document.getElementById(`exp-${qId}`);

            buttons.forEach(btn => btn.disabled = true); // Khóa nút

            const clickedBtn = document.getElementById(`btn-${qId}-${btnIdx}`);
            
            if (isCorrect) {
                clickedBtn.classList.add('correct');
                playDing();
                triggerConfetti(clickedBtn);
                currentScore++;
            } else {
                clickedBtn.classList.add('wrong');
                card.classList.add('shake');
                playBuzz();
                buttons.forEach(btn => {
                    if(btn.onclick.toString().includes("true")) btn.classList.add('correct');
                });
                errorDetails += `- Sai câu ${qId}: Chọn ${chosenLabel}\n`;
            }
            exp.style.display = 'block';
        }

            } else {

                errorDetails += `- Sai Điền từ ${qId}: Chọn ${chosenAns} (Đúng: ${correctAns})\n`;

        function checkRewrite(rwId) {

            let isCorrect = false;
            // Xóa dấu chấm câu dư thừa cuối để chống học sinh gõ dư chấm
            let cleanUserVal = userVal.replace(/[.?!]$/, "").replace(/\s+/g, " ");

            for(let key of data.ansKeys) {
                let cleanKey = key.toLowerCase().replace(/[.?!]$/, "");
                if (cleanUserVal === cleanKey || data.start.toLowerCase().trim() + " " + cleanUserVal === cleanKey) {

                errorDetails += `- Sai Viết lại ${rwId}: "${inputEl.value}"\n`;
            }
            expDiv.style.display = 'block';

            const rect = element.getBoundingClientRect();

            confetti({ particleCount: 50, spread: 60, origin: { x: x, y: y }, colors: ['#00D26A', '#FDCB6E', '#4A90E2'] });
        }

            if(percent === 1) feedbackEl.innerText = "Tuyệt đỉnh! Con đạt điểm tối đa! Xuất sắc! 🏆🌟";
            else if (percent >= 0.8) feedbackEl.innerText = "Giỏi lắm! Con đã nắm bài rất tốt! Tiếp tục phát huy nhé! 🚀";
            else if (percent >= 0.5) feedbackEl.innerText = "Khá tốt! Con hãy xem lại kỹ các câu sai phần giải thích nhé! 💪";
            else feedbackEl.innerText = "Không sao! Cố gắng luyện tập và đọc kỹ giải thích để tiến bộ hơn nha con! ❤️";

            document.getElementById('ss-form').submit();
            submitted = true;

            setTimeout(showResultScreen, 1500); 
        }

        function showResultScreen() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
            confetti({ particleCount: 200, spread: 120, origin: { y: 0.2 } });
            playDing(); setTimeout(playDing, 200); setTimeout(playDing, 400);
        }
    </script>
</body>
</html>
